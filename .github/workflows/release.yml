name: Create and Publish NuGet Package

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+" # Trigger on semantic version tags

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Pack NuGet package
        run: dotnet pack TKH.S7Plus.Net/TKH.S7Plus.Net.csproj --configuration Release /p:PackageVersion=${GITHUB_REF#refs/tags/} --output ./output

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ./output/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
